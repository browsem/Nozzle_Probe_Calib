[nozzle_probe_calibrate]
nozzle_pin: ^!PG11          # nozzle-touch sensor input pin
nozzle_position: 10, 20     # XY of the nozzle when it touches that sensor
#probe_position:            # XY where the probe is measured (test spot); default = nozzle_position
#probe_pin:                 # default: reuse the [probe] pin
#x_offset:                  # default: [probe] x_offset
#y_offset:                  # default: [probe] y_offset
#samples:                   # default: [probe] samples
#samples_tolerance:         # optional max spread between samples
#sample_retract_dist:       # default: [probe] value
#speed / lift_speed:        # default: [probe] values
#travel_z: 10               # Z for XY moves and where each probe run starts
#probe_depth: 15            # max distance to travel down before "no trigger"
#extra_offset: 0.0          # manual material/test-spot correction
